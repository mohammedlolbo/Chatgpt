<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Subscriptions</title>
  <style>
    body {
      background: black;
      color: #00ffcc;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .glow-box {
      border: 2px solid #00ffcc;
      padding: 20px;
      box-shadow: 0 0 20px #00ffcc;
      text-align: center;
      border-radius: 10px;
      background-color: rgba(0, 0, 0, 0.7);
    }
    h1 {
      text-shadow: 0 0 10px #00ffcc;
      margin-bottom: 10px;
    }
    p {
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="glow-box">
    <h1>Subscription Status</h1>
    <p>Your plan: <strong>Premium</strong></p>
    <p>Valid until: <strong>2099-12-31</strong></p>
    <p>Thank you for supporting us!</p>
  </div>
</body>
</html>
